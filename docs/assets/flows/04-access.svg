<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1285" viewBox="0 0 1060 1285" role="img" aria-labelledby="title">
<title id="title">4. Login, admission dan izin lalu lintas</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="#40576c"/></marker></defs>
<rect width="1060" height="1285" fill="white"/>
<text x="40" y="38" font-family="sans-serif" font-size="23" font-weight="bold" fill="#173d5a">4. Login, admission dan izin lalu lintas</text>
<polyline points="250,185 250,230" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,330 250,375" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,475 250,520" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="430,570 630,570" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="560" font-family="sans-serif" font-size="15" fill="#273e52">Tidak</text>
<polyline points="250,620 250,665" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="648" font-family="sans-serif" font-size="15" fill="#273e52">Ya</text>
<polyline points="250,765 250,810" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,910 250,955" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="938" font-family="sans-serif" font-size="15" fill="#273e52">Aplikasi</text>
<polyline points="250,910 250,933 810,933 810,955" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="925" font-family="sans-serif" font-size="15" fill="#273e52">Internet</text>
<polyline points="250,1055 250,1100" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="1083" font-family="sans-serif" font-size="15" fill="#273e52">Izin valid</text>
<polyline points="810,1055 810,1078 250,1078 250,1100" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="1070" font-family="sans-serif" font-size="15" fill="#273e52">Izin valid</text>
<rect x="70" y="85" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="120" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Karyawan login lewat HTTPS</text>
<text x="250" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Server memeriksa akun dan binding</text>
<text x="250" y="160" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Login saja belum menambah peer</text>
<rect x="70" y="230" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="265" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Connect: challenge dan proof</text>
<text x="250" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Endpoint membuktikan kepemilikan key</text>
<text x="250" y="305" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Server memeriksa sesi karyawan</text>
<rect x="70" y="375" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Enam cek: signature CA, masa berlaku,</text>
<text x="250" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">CRL terkini, serial pencabutan,</text>
<text x="250" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">proof key dan binding public key WG</text>
<polygon points="250,520 430,570 250,620 70,570" fill="#fff4d6" stroke="#946200" stroke-width="2"/>
<text x="250" y="575" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Sesi dan semua cek lolos?</text>
<rect x="630" y="520" width="360" height="100" rx="12" fill="#fff0ed" stroke="#a33e32" stroke-width="2"/>
<text x="810" y="555" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Tolak admission / gagal tertutup</text>
<text x="810" y="575" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Tidak memberi peer/lease baru</text>
<text x="810" y="595" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Internet langsung tetap diblok di schema2</text>
<rect x="70" y="665" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="700" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Server memasang peer dan lease</text>
<text x="250" y="720" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Client membangun tunnel WireGuard</text>
<text x="250" y="740" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Periksa handshake dan konektivitas</text>
<rect x="70" y="810" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="845" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Periksa kebijakan lalu lintas</text>
<text x="250" y="865" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Lease/sesi valid tetap diperlukan</text>
<text x="250" y="885" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Tunnel aktif bukan izin semua tujuan</text>
<rect x="70" y="955" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="990" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Aplikasi internal: identitas + resource</text>
<text x="250" y="1010" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">protokol + port harus diizinkan</text>
<text x="250" y="1030" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Tidak ada izin = tolak</text>
<rect x="630" y="955" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="810" y="990" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Internet terkelola: gateway aktif</text>
<text x="810" y="1010" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">dan grant internet untuk identitas</text>
<text x="810" y="1030" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Tanpa grant = tolak internet gateway</text>
<rect x="70" y="1100" width="360" height="100" rx="12" fill="#e3f5ea" stroke="#246744" stroke-width="2"/>
<text x="250" y="1135" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Trafik yang diizinkan dapat lewat</text>
<text x="250" y="1155" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Renewal berkala; lanjut diagram 5</text>
<text x="250" y="1175" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Lease renewal tidak memperpanjang cert</text>
</svg>
