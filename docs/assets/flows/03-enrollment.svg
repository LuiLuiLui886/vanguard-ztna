<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1285" viewBox="0 0 1060 1285" role="img" aria-labelledby="title">
<title id="title">3. Policy Windows dan pendaftaran perangkat</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="#40576c"/></marker></defs>
<rect width="1060" height="1285" fill="white"/>
<text x="40" y="38" font-family="sans-serif" font-size="23" font-weight="bold" fill="#173d5a">3. Policy Windows dan pendaftaran perangkat</text>
<polyline points="250,185 250,230" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,330 250,375" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="358" font-family="sans-serif" font-size="15" fill="#273e52">Ya</text>
<polyline points="430,280 630,280" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="270" font-family="sans-serif" font-size="15" fill="#273e52">Tidak</text>
<polyline points="250,475 250,520" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="810,330 810,498 250,498 250,520" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,620 250,665" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,765 250,810" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="430,860 630,860" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="850" font-family="sans-serif" font-size="15" fill="#273e52">Tidak</text>
<polyline points="250,910 250,955" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="938" font-family="sans-serif" font-size="15" fill="#273e52">Ya</text>
<polyline points="250,1055 250,1100" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="70" y="85" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="140" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Profil terverifikasi</text>
<polygon points="250,230 430,280 250,330 70,280" fill="#fff4d6" stroke="#946200" stroke-width="2"/>
<text x="250" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Schema2 terkelola?</text>
<rect x="70" y="375" width="360" height="100" rx="12" fill="#fff0ed" stroke="#a33e32" stroke-width="2"/>
<text x="250" y="410" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Aktifkan / periksa policy Windows</text>
<text x="250" y="430" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">SETELAH BERHASIL: internet langsung</text>
<text x="250" y="450" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">diblok; jalur kontrol terbatas tersedia</text>
<rect x="630" y="230" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="810" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Schema1: akses aplikasi internal</text>
<text x="810" y="295" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Tidak mengaktifkan lockdown internet</text>
<rect x="70" y="520" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="555" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Endpoint membuat atau memakai key</text>
<text x="250" y="575" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">X.509 dan WireGuard miliknya sendiri</text>
<text x="250" y="595" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Ekspor request PUBLIK</text>
<rect x="70" y="665" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="700" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Admin login + TOTP di dashboard</text>
<text x="250" y="720" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Periksa request dan binding karyawan</text>
<text x="250" y="740" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">CA yang ada menandatangani sertifikat</text>
<polygon points="250,810 430,860 250,910 70,860" fill="#fff4d6" stroke="#946200" stroke-width="2"/>
<text x="250" y="865" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Bundle sudah tersedia?</text>
<rect x="630" y="810" width="360" height="100" rx="12" fill="#fff0ed" stroke="#a33e32" stroke-width="2"/>
<text x="810" y="845" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Menunggu admin: kode20</text>
<text x="810" y="865" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Jalankan paket lagi setelah disetujui</text>
<text x="810" y="885" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Lockdown yang aktif tetap berlaku</text>
<rect x="70" y="955" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="990" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Import bundle; cek kecocokan binding</text>
<text x="250" y="1010" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Private key tetap di endpoint</text>
<text x="250" y="1030" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Registrasi belum menambah peer</text>
<rect x="70" y="1100" width="360" height="100" rx="12" fill="#e3f5ea" stroke="#246744" stroke-width="2"/>
<text x="250" y="1135" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Siap login; lanjut diagram 4</text>
<text x="250" y="1155" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Sertifikat yang sudah ada dicek ulang</text>
<text x="250" y="1175" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">/prepare-only berhenti tanpa connect</text>
</svg>
