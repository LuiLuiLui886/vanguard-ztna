<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1285" viewBox="0 0 1060 1285" role="img" aria-labelledby="title">
<title id="title">1. Persiapan CA, server dan dashboard</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="#40576c"/></marker></defs>
<rect width="1060" height="1285" fill="white"/>
<text x="40" y="38" font-family="sans-serif" font-size="23" font-weight="bold" fill="#173d5a">1. Persiapan CA, server dan dashboard</text>
<polyline points="250,185 250,230" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,330 250,375" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="358" font-family="sans-serif" font-size="15" fill="#273e52">Tidak</text>
<polyline points="430,280 630,280" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="270" font-family="sans-serif" font-size="15" fill="#273e52">Ya</text>
<polyline points="250,475 250,520" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="810,330 810,498 250,498 250,520" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,620 250,665" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,765 250,810" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="250,910 250,955" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="430,1005 630,1005" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="460" y="995" font-family="sans-serif" font-size="15" fill="#273e52">Tidak</text>
<polyline points="250,1055 250,1100" fill="none" stroke="#40576c" stroke-width="2" marker-end="url(#arrow)"/>
<text x="155" y="1083" font-family="sans-serif" font-size="15" fill="#273e52">Ya</text>
<rect x="70" y="85" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="130" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Operator: inventaris, alamat, waktu</text>
<text x="250" y="150" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">backup dan akses console</text>
<polygon points="250,230 430,280 250,330 70,280" fill="#fff4d6" stroke="#946200" stroke-width="2"/>
<text x="250" y="285" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">CA sudah ada?</text>
<rect x="70" y="375" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="420" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Instalasi BARU: buat Root CA privat</text>
<text x="250" y="440" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">single-tier dan lindungi private key</text>
<rect x="630" y="230" width="360" height="100" rx="12" fill="#e3f5ea" stroke="#246744" stroke-width="2"/>
<text x="810" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Pakai CA dan histori yang ada</text>
<text x="810" y="295" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Periksa konsistensi; jangan init ulang</text>
<rect x="70" y="520" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="565" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Siapkan HTTPS, trust dan secret layanan</text>
<text x="250" y="585" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">CA menerbitkan sertifikat dan CRL</text>
<rect x="70" y="665" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="700" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Server: WireGuard, validator, daemon</text>
<text x="250" y="720" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">firewall default-deny dan resource</text>
<text x="250" y="740" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Gateway internet bila mode terkelola</text>
<rect x="70" y="810" width="360" height="100" rx="12" fill="#edf5ff" stroke="#245a8d" stroke-width="2"/>
<text x="250" y="845" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Dashboard: akun admin dan TOTP</text>
<text x="250" y="865" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Akun karyawan, binding, audit</text>
<text x="250" y="885" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">CA/server diakses lewat API berizin</text>
<polygon points="250,955 430,1005 250,1055 70,1005" fill="#fff4d6" stroke="#946200" stroke-width="2"/>
<text x="250" y="1010" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Dependensi siap?</text>
<rect x="630" y="955" width="360" height="100" rx="12" fill="#fff0ed" stroke="#a33e32" stroke-width="2"/>
<text x="810" y="990" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Perbaiki dependensi yang gagal</text>
<text x="810" y="1010" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Status gagal/tidak diketahui</text>
<text x="810" y="1030" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Jangan memberi akses lewat bypass</text>
<rect x="70" y="1100" width="360" height="100" rx="12" fill="#e3f5ea" stroke="#246744" stroke-width="2"/>
<text x="250" y="1135" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Admin siapkan profil publik, root CA</text>
<text x="250" y="1155" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">alokasi perangkat/IP dan pin server</text>
<text x="250" y="1175" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#162d40">Lanjut diagram 2</text>
</svg>
