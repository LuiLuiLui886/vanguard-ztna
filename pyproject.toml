[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vanguard-ztna"
version = "0.1.12"
description = "Certificate admission for the VanGuard WireGuard lab"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.1.3,<3.2",
  "cryptography>=46.0.6,<47",
  "requests>=2.32.5,<3",
  "pyotp>=2.9,<3",
  "gunicorn>=23,<26; sys_platform != 'win32'",
  "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
vanguard-ca = "vanguard.ca:main"
vanguard-client = "vanguard.client:main"
vanguard-admin = "vanguard.admin:main"
vanguard-daemon = "vanguard.server:daemon_main"

[tool.setuptools.packages.find]
include = ["vanguard*"]

[tool.setuptools.package-data]
vanguard = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
